name: Deploy Website
on:
  push:
    branches:
      - main # Startet, sobald du Code auf den 'main'-Zweig hochlädst

permissions:
  id-token: write # Der Einlass-Aufkleber für den Wächter!
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --engine-strict=false

      - name: Build Astro
        run: npm run build # Erstellt deinen fertigen dist/ Ordner

      - name: AWS Anmeldung via Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload zu S3
        run: aws s3 sync dist/ s3://bucket-astro1 --delete
